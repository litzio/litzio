[package]
name = "litzio-markdown-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
markdown = { version = "=1.0.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
