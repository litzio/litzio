<svg width="1440" height="1032" viewBox="0 0 1440 1032" font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1440" height="1032" fill="#F6F7F9"/><text fill="#20242C" font-size="30" font-weight="bold"><tspan x="32" y="59.5">B  문서 속성형</tspan></text><text fill="#545C68" font-size="14"><tspan x="32" y="91.6">Typora의 탐색 전환 + Craft·Zettlr의 문서 주변 패널  ·  개념안 / 미구현</tspan></text><g clip-path="url(#clip0_2_36)"><rect x="32" y="118" width="1376" height="752" rx="8" fill="white"/><rect width="1376" height="50" transform="translate(33 119)" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="41" y="149.6">Litzio</tspan></text><text fill="#20242C" font-size="14"><tspan x="217" y="149.6">docs / 작성 가이드.md</tspan></text><text fill="#A12B32" font-size="12"><tspan x="485" y="148.8">수정됨</tspan></text><path d="M1048 133C1048 130.79 1049.79 129 1052 129H1108C1110.21 129 1112 130.79 1112 133V155C1112 157.21 1110.21 159 1108 159H1052C1049.79 159 1048 157.21 1048 155V133Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="1060" y="149.6">Visual</tspan></text><path d="M1128 133C1128 130.79 1129.79 129 1132 129H1195C1197.21 129 1199 130.79 1199 133V155C1199 157.21 1197.21 159 1195 159H1132C1129.79 159 1128 157.21 1128 155V133Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1140" y="149.6">Source</tspan></text><path d="M1215 133C1215 130.79 1216.79 129 1219 129H1261C1263.21 129 1265 130.79 1265 133V155C1265 157.21 1263.21 159 1261 159H1219C1216.79 159 1215 157.21 1215 155V133Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="1227" y="149.6">속성</tspan></text><path d="M1281 132C1281 129.79 1282.79 128 1285 128H1345C1347.21 128 1349 129.79 1349 132V156C1349 158.21 1347.21 160 1345 160H1285C1282.79 160 1281 158.21 1281 156V132Z" fill="#A12B32"/><text fill="white" font-size="14" font-weight="500"><tspan x="1293" y="148.6">Save</tspan></text><path d="M1365 132C1365 129.79 1366.79 128 1369 128H1397C1399.21 128 1401 129.79 1401 132V156C1401 158.21 1399.21 160 1397 160H1369C1366.79 160 1365 158.21 1365 156V132Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1377" y="148.6">⋯</tspan></text><rect width="1376" height="1" transform="translate(33 169)" fill="#E7EAF0"/><g clip-path="url(#clip1_2_36)"><rect width="224" height="701" transform="translate(33 170)" fill="#F6F7F9"/><path d="M49 191C49 188.79 50.79 187 53 187H100C102.21 187 104 188.79 104 191V213C104 215.21 102.21 217 100 217H53C50.79 217 49 215.21 49 213V191Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="61" y="207.6">Files</tspan></text><path d="M112 191C112 188.79 113.79 187 116 187H182C184.21 187 186 188.79 186 191V213C186 215.21 184.21 217 182 217H116C113.79 217 112 215.21 112 213V191Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="124" y="207.6">Outline</tspan></text><rect width="192" height="1" transform="translate(49 230)" fill="#E7EAF0"/><text fill="#606874" font-size="12"><tspan x="49" y="258.8">이 문서의 목차</tspan></text><text fill="#545C68" font-size="14"><tspan x="57" y="301.6">구조화 문서 작성 가이드</tspan></text><text fill="#545C68" font-size="14"><tspan x="57" y="349.6">1.  문서 구조</tspan></text><rect width="192" height="36" transform="translate(49 373)" fill="#E9F0FF"/><text fill="#315FD4" font-size="14"><tspan x="57" y="397.6">     1.1  제목 번호</tspan></text><text fill="#545C68" font-size="14"><tspan x="57" y="445.6">2.  표와 참조</tspan></text><text fill="#545C68" font-size="14"><tspan x="57" y="493.6">3.  저장과 검증</tspan></text><text fill="#606874" font-size="12"><tspan x="49" y="806.8">탐색 패널 접기  ‹</tspan></text><rect width="864" height="702" transform="translate(257 170)" fill="white"/><text fill="#606874" font-size="12"><tspan x="339" y="217.8">DOCUMENTATION   /   작성 가이드</tspan></text><text fill="#20242C" font-size="30" font-weight="bold"><tspan x="339" y="267.5">구조화 문서 작성 가이드</tspan></text><text fill="#545C68" font-size="17"><tspan x="339" y="306.8">내용과 구조를 함께 다루는 기술문서의 예시입니다.&#10;</tspan><tspan x="339" y="332.8">아래 세 화면은 같은 문서와 같은 저장 상태를 사용합니다.</tspan></text><text fill="#20242C" font-size="22" font-weight="bold"><tspan x="339" y="388.8">1. 문서 구조</tspan></text><text fill="#20242C" font-size="17"><tspan x="339" y="424.8">제목은 문서의 계층을 나타냅니다. 본문은 읽기 좋은 폭을&#10;</tspan><tspan x="339" y="450.8">유지하고, 주변 도구는 필요할 때 열어 사용합니다.</tspan></text><text fill="#20242C" font-size="14" font-weight="500"><tspan x="339" y="481.6">1.1 제목 번호</tspan></text><text fill="#20242C" font-size="17"><tspan x="339" y="514.8">제목에 숫자를 직접 입력하지 않고 번호 정책으로 표시합니다.</tspan></text><g clip-path="url(#clip2_2_36)"><rect width="700" height="39" transform="translate(339 529)" fill="#F6F7F9"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="347" y="553.6">요소</tspan></text><text fill="#545C68" font-size="14" font-weight="500"><tspan x="559" y="553.6">역할</tspan></text><text fill="#20242C" font-size="14"><tspan x="347" y="592.6">Heading</tspan></text><text fill="#545C68" font-size="14"><tspan x="559" y="592.6">문서의 구조와 탐색 기준</tspan></text><text fill="#20242C" font-size="14"><tspan x="347" y="631.6">Paragraph</tspan></text><text fill="#545C68" font-size="14"><tspan x="559" y="631.6">설명과 본문</tspan></text><text fill="#20242C" font-size="14"><tspan x="347" y="670.6">Table</tspan></text><text fill="#545C68" font-size="14"><tspan x="559" y="670.6">항목 간 비교와 관계</tspan></text></g><text fill="#20242C" font-size="22" font-weight="bold"><tspan x="339" y="718.8">2. 표와 참조</tspan></text><text fill="#545C68" font-size="17"><tspan x="339" y="754.8">본문의 의미를 유지하면서 표시 방식만 조정합니다.</tspan></text><g clip-path="url(#clip3_2_36)"><rect x="1121" y="170" width="288" height="701" fill="white"/><rect width="288" height="680" transform="translate(1122 171)" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1138" y="208.6">문서 표시</tspan></text><text fill="#20242C" font-size="14"><tspan x="1350" y="208.6">×</tspan></text><text fill="#606874" font-size="12"><tspan x="1138" y="246.8">작성 가이드.md</tspan></text><rect width="256" height="1" transform="translate(1138 265)" fill="#E7EAF0"/><text fill="#315FD4" font-size="12"><tspan x="1138" y="293.8">문서에 저장</tspan></text><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1138" y="333.6">제목 번호</tspan></text><path d="M1334 316C1334 313.79 1335.79 312 1338 312H1386C1388.21 312 1390 313.79 1390 316V340C1390 342.21 1388.21 344 1386 344H1338C1335.79 344 1334 342.21 1334 340V316Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="1346" y="332.6">켜짐</tspan></text><text fill="#545C68" font-size="12"><tspan x="1138" y="371.8">H1은 제목으로 유지&#10;</tspan><tspan x="1138" y="393.8">H2–H6에 번호 적용</tspan></text><rect width="256" height="1" transform="translate(1138 412)" fill="#E7EAF0"/><text fill="#606874" font-size="12"><tspan x="1138" y="440.8">이 기기에서만</tspan></text><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1138" y="475.6">본문 폭</tspan></text><path d="M1138 497C1138 494.79 1139.79 493 1142 493H1214C1216.21 493 1218 494.79 1218 497V521C1218 523.21 1216.21 525 1214 525H1142C1139.79 525 1138 523.21 1138 521V497Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="1150" y="513.6">표준</tspan></text><path d="M1226 497C1226 494.79 1227.79 493 1230 493H1302C1304.21 493 1306 494.79 1306 497V521C1306 523.21 1304.21 525 1302 525H1230C1227.79 525 1226 523.21 1226 521V497Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1238" y="513.6">넓게</tspan></text><text fill="#545C68" font-size="12"><tspan x="1138" y="552.8">화면 표시만 변경합니다.&#10;</tspan><tspan x="1138" y="574.8">문서 파일에는 저장하지 않습니다.</tspan></text><rect width="256" height="1" transform="translate(1138 613)" fill="#E7EAF0"/><text fill="#606874" font-size="12"><tspan x="1138" y="641.8">번호 미리보기</tspan></text><rect width="256" height="124" transform="translate(1138 660)" fill="#F6F7F9"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1150" y="688.6">문서 제목</tspan></text><text fill="#545C68" font-size="14"><tspan x="1150" y="718.6">1. 문서 구조&#10;</tspan><tspan x="1150" y="740.6">  1.1 제목 번호&#10;</tspan><tspan x="1150" y="762.6">2. 표와 참조</tspan></text></g><rect x="1121.5" y="170.5" width="287" height="700" stroke="#E7EAF0"/></g></g><rect x="32.5" y="118.5" width="1375" height="751" rx="7.5" stroke="#D9DDE4"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="32" y="902.6">탐색은 왼쪽, 문서 표시 속성은 오른쪽에서 본문과 나란히 조정</tspan></text><text fill="#545C68" font-size="14"><tspan x="32" y="932.6">대가: 표시 옵션이 적을 때는 오른쪽 패널이 차지하는 면적 대비 효용이 낮음</tspan></text><text fill="#606874" font-size="12"><tspan x="32" y="961.8">공통: 제목 번호는 문서에 저장 · 본문 폭은 로컬 설정 · Source는 읽기 전용 · Reload는 파일 메뉴에서 확인 후 실행</tspan></text><defs><clipPath id="clip0_2_36"><rect x="32" y="118" width="1376" height="752" rx="8" fill="white"/></clipPath><clipPath id="clip1_2_36"><rect width="1376" height="701" fill="white" transform="translate(33 170)"/></clipPath><clipPath id="clip2_2_36"><rect width="700" height="156" fill="white" transform="translate(339 529)"/></clipPath><clipPath id="clip3_2_36"><rect x="1121" y="170" width="288" height="701" fill="white"/></clipPath></defs></svg>
