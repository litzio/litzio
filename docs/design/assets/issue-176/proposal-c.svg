<svg width="1440" height="1032" viewBox="0 0 1440 1032" font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1440" height="1032" fill="#F6F7F9"/><text fill="#20242C" font-size="30" font-weight="bold"><tspan x="32" y="59.5">C  도구 전환형</tspan></text><text fill="#545C68" font-size="14"><tspan x="32" y="91.6">Craft의 왼쪽 Styles + VS Code의 사이드바 전환  ·  개념안 / 미구현</tspan></text><g clip-path="url(#clip0_2_37)"><rect x="32" y="118" width="1376" height="752" rx="8" fill="white"/><rect width="1376" height="50" transform="translate(33 119)" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="41" y="149.6">Litzio</tspan></text><text fill="#20242C" font-size="14"><tspan x="217" y="149.6">docs / 작성 가이드.md</tspan></text><text fill="#A12B32" font-size="12"><tspan x="485" y="148.8">수정됨</tspan></text><path d="M1114 133C1114 130.79 1115.79 129 1118 129H1174C1176.21 129 1178 130.79 1178 133V155C1178 157.21 1176.21 159 1174 159H1118C1115.79 159 1114 157.21 1114 155V133Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="1126" y="149.6">Visual</tspan></text><path d="M1194 133C1194 130.79 1195.79 129 1198 129H1261C1263.21 129 1265 130.79 1265 133V155C1265 157.21 1263.21 159 1261 159H1198C1195.79 159 1194 157.21 1194 155V133Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1206" y="149.6">Source</tspan></text><path d="M1281 132C1281 129.79 1282.79 128 1285 128H1345C1347.21 128 1349 129.79 1349 132V156C1349 158.21 1347.21 160 1345 160H1285C1282.79 160 1281 158.21 1281 156V132Z" fill="#A12B32"/><text fill="white" font-size="14" font-weight="500"><tspan x="1293" y="148.6">Save</tspan></text><path d="M1365 132C1365 129.79 1366.79 128 1369 128H1397C1399.21 128 1401 129.79 1401 132V156C1401 158.21 1399.21 160 1397 160H1369C1366.79 160 1365 158.21 1365 156V132Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1377" y="148.6">⋯</tspan></text><rect width="1376" height="1" transform="translate(33 169)" fill="#E7EAF0"/><g clip-path="url(#clip1_2_37)"><rect width="56" height="701" transform="translate(33 170)" fill="#F6F7F9"/><path d="M41 182C41 179.79 42.79 178 45 178H77C79.21 178 81 179.79 81 182V206C81 208.21 79.21 210 77 210H45C42.79 210 41 208.21 41 206V182Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="53" y="198.6">파일</tspan></text><path d="M41 230C41 227.79 42.79 226 45 226H77C79.21 226 81 227.79 81 230V254C81 256.21 79.21 258 77 258H45C42.79 258 41 256.21 41 254V230Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="53" y="246.6">표시</tspan></text><text fill="#606874" font-size="12"><tspan x="41" y="745.8">설정</tspan></text><g clip-path="url(#clip2_2_37)"><rect x="89" y="170" width="248" height="701" fill="white"/><rect width="248" height="680" transform="translate(90 171)" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="106" y="208.6">문서 표시</tspan></text><text fill="#20242C" font-size="14"><tspan x="278" y="208.6">×</tspan></text><text fill="#606874" font-size="12"><tspan x="106" y="246.8">작성 가이드.md</tspan></text><rect width="216" height="1" transform="translate(106 265)" fill="#E7EAF0"/><text fill="#315FD4" font-size="12"><tspan x="106" y="293.8">문서에 저장</tspan></text><text fill="#20242C" font-size="14" font-weight="500"><tspan x="106" y="333.6">제목 번호</tspan></text><path d="M262 316C262 313.79 263.79 312 266 312H314C316.21 312 318 313.79 318 316V340C318 342.21 316.21 344 314 344H266C263.79 344 262 342.21 262 340V316Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="274" y="332.6">켜짐</tspan></text><text fill="#545C68" font-size="12"><tspan x="106" y="371.8">H1은 제목으로 유지&#10;</tspan><tspan x="106" y="393.8">H2–H6에 번호 적용</tspan></text><rect width="216" height="1" transform="translate(106 412)" fill="#E7EAF0"/><text fill="#606874" font-size="12"><tspan x="106" y="440.8">이 기기에서만</tspan></text><text fill="#20242C" font-size="14" font-weight="500"><tspan x="106" y="475.6">본문 폭</tspan></text><path d="M106 497C106 494.79 107.79 493 110 493H182C184.21 493 186 494.79 186 497V521C186 523.21 184.21 525 182 525H110C107.79 525 106 523.21 106 521V497Z" fill="#E9F0FF"/><text fill="#315FD4" font-size="14" font-weight="500"><tspan x="118" y="513.6">표준</tspan></text><path d="M194 497C194 494.79 195.79 493 198 493H270C272.21 493 274 494.79 274 497V521C274 523.21 272.21 525 270 525H198C195.79 525 194 523.21 194 521V497Z" fill="white"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="206" y="513.6">넓게</tspan></text><text fill="#545C68" font-size="12"><tspan x="106" y="552.8">화면 표시만 변경합니다.&#10;</tspan><tspan x="106" y="574.8">문서 파일에는 저장하지 않습니다.</tspan></text><rect width="216" height="1" transform="translate(106 613)" fill="#E7EAF0"/><text fill="#606874" font-size="12"><tspan x="106" y="641.8">번호 미리보기</tspan></text><rect width="216" height="124" transform="translate(106 660)" fill="#F6F7F9"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="118" y="688.6">문서 제목</tspan></text><text fill="#545C68" font-size="14"><tspan x="118" y="718.6">1. 문서 구조&#10;</tspan><tspan x="118" y="740.6">  1.1 제목 번호&#10;</tspan><tspan x="118" y="762.6">2. 표와 참조</tspan></text></g><rect x="89.5" y="170.5" width="247" height="700" stroke="#E7EAF0"/><rect width="848" height="702" transform="translate(337 170)" fill="white"/><text fill="#606874" font-size="12"><tspan x="411" y="217.8">DOCUMENTATION   /   작성 가이드</tspan></text><text fill="#20242C" font-size="30" font-weight="bold"><tspan x="411" y="267.5">구조화 문서 작성 가이드</tspan></text><text fill="#545C68" font-size="17"><tspan x="411" y="306.8">내용과 구조를 함께 다루는 기술문서의 예시입니다.&#10;</tspan><tspan x="411" y="332.8">아래 세 화면은 같은 문서와 같은 저장 상태를 사용합니다.</tspan></text><text fill="#20242C" font-size="22" font-weight="bold"><tspan x="411" y="388.8">1. 문서 구조</tspan></text><text fill="#20242C" font-size="17"><tspan x="411" y="424.8">제목은 문서의 계층을 나타냅니다. 본문은 읽기 좋은 폭을&#10;</tspan><tspan x="411" y="450.8">유지하고, 주변 도구는 필요할 때 열어 사용합니다.</tspan></text><text fill="#20242C" font-size="14" font-weight="500"><tspan x="411" y="481.6">1.1 제목 번호</tspan></text><text fill="#20242C" font-size="17"><tspan x="411" y="514.8">제목에 숫자를 직접 입력하지 않고 번호 정책으로 표시합니다.</tspan></text><g clip-path="url(#clip3_2_37)"><rect width="700" height="39" transform="translate(411 529)" fill="#F6F7F9"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="419" y="553.6">요소</tspan></text><text fill="#545C68" font-size="14" font-weight="500"><tspan x="631" y="553.6">역할</tspan></text><text fill="#20242C" font-size="14"><tspan x="419" y="592.6">Heading</tspan></text><text fill="#545C68" font-size="14"><tspan x="631" y="592.6">문서의 구조와 탐색 기준</tspan></text><text fill="#20242C" font-size="14"><tspan x="419" y="631.6">Paragraph</tspan></text><text fill="#545C68" font-size="14"><tspan x="631" y="631.6">설명과 본문</tspan></text><text fill="#20242C" font-size="14"><tspan x="419" y="670.6">Table</tspan></text><text fill="#545C68" font-size="14"><tspan x="631" y="670.6">항목 간 비교와 관계</tspan></text></g><text fill="#20242C" font-size="22" font-weight="bold"><tspan x="411" y="718.8">2. 표와 참조</tspan></text><text fill="#545C68" font-size="17"><tspan x="411" y="754.8">본문의 의미를 유지하면서 표시 방식만 조정합니다.</tspan></text><rect width="224" height="701" transform="translate(1185 170)" fill="#F6F7F9"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="1201" y="207.6">Outline</tspan></text><text fill="#20242C" font-size="14"><tspan x="1353" y="207.6">×</tspan></text><rect width="192" height="1" transform="translate(1201 230)" fill="#E7EAF0"/><text fill="#545C68" font-size="14"><tspan x="1209" y="267.6">문서 작성 가이드</tspan></text><text fill="#545C68" font-size="14"><tspan x="1209" y="315.6">1. 문서 구조</tspan></text><rect width="192" height="36" transform="translate(1201 339)" fill="#E9F0FF"/><text fill="#315FD4" font-size="14"><tspan x="1209" y="363.6">   1.1 제목 번호</tspan></text><text fill="#545C68" font-size="14"><tspan x="1209" y="411.6">2. 표와 참조</tspan></text><text fill="#545C68" font-size="14"><tspan x="1209" y="459.6">3. 저장과 검증</tspan></text><text fill="#606874" font-size="12"><tspan x="1201" y="530.8">현재 섹션을 표시하고&#10;</tspan><tspan x="1201" y="552.8">클릭하면 본문으로 이동</tspan></text></g></g><rect x="32.5" y="118.5" width="1375" height="751" rx="7.5" stroke="#D9DDE4"/><text fill="#20242C" font-size="14" font-weight="500"><tspan x="32" y="902.6">왼쪽은 파일/표시 도구를 전환하고, 오른쪽은 목차를 유지</tspan></text><text fill="#545C68" font-size="14"><tspan x="32" y="932.6">대가: 표시 설정을 여는 동안 파일 목록은 숨겨지므로 전환 비용을 검증해야 함</tspan></text><text fill="#606874" font-size="12"><tspan x="32" y="961.8">공통: 제목 번호는 문서에 저장 · 본문 폭은 로컬 설정 · Source는 읽기 전용 · Reload는 파일 메뉴에서 확인 후 실행</tspan></text><defs><clipPath id="clip0_2_37"><rect x="32" y="118" width="1376" height="752" rx="8" fill="white"/></clipPath><clipPath id="clip1_2_37"><rect width="1376" height="701" fill="white" transform="translate(33 170)"/></clipPath><clipPath id="clip2_2_37"><rect x="89" y="170" width="248" height="701" fill="white"/></clipPath><clipPath id="clip3_2_37"><rect width="700" height="156" fill="white" transform="translate(411 529)"/></clipPath></defs></svg>
