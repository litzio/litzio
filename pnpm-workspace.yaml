packages:
  - packages/*
  - apps/*
  - plugins/*

# tsx uses esbuild's native executable; approve its install-time binary check.
allowBuilds:
  # electron-builder's Squirrel.Windows dependency picks a 7z binary at install time. The desktop
  # app ships NSIS only and never runs Squirrel, so the script stays off.
  electron-winstaller@5.4.0: false
  esbuild@0.28.2: true

# Already locked on master before the pnpm 12 migration (2026-09-23).
# Keep the built-in release-age policy; exempt only these existing versions.
minimumReleaseAgeExclude:
  - cn@0.4.0
  - fs-extra@11.4.1

patchedDependencies:
  # #346, #11; docs/contributing/dependency-patches.md
  linkify-it@4.0.1: patches/linkify-it@4.0.1.patch
  # #11, #346; docs/contributing/dependency-patches.md
  markdown-it@13.0.2: patches/markdown-it@13.0.2.patch
  # #734, #730; docs/contributing/dependency-patches.md
  myst-parser@1.7.4: patches/myst-parser@1.7.4.patch
  # #730, #734; docs/contributing/dependency-patches.md
  myst-to-md@1.0.17: patches/myst-to-md@1.0.17.patch
  # #542, #144, #489; docs/contributing/dependency-patches.md
  prosemirror-view@1.42.4: patches/prosemirror-view@1.42.4.patch
