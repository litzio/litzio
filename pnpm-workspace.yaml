packages:
  - packages/*
  - apps/*

# tsx uses esbuild's native executable; approve its install-time binary check.
allowBuilds:
  # electron-builder's Squirrel.Windows dependency picks a 7z binary at install time. The desktop
  # app ships NSIS only and never runs Squirrel, so the script stays off.
  electron-winstaller@5.4.0: false
  esbuild@0.28.2: true

packageExtensions:
  # #1147; pair the patched userland import with its runtime dependency.
  markdown-it@13.0.2:
    dependencies:
      punycode: 2.3.1

patchedDependencies:
  # #346, #11; docs/contributing/dependency-patches.md
  linkify-it@4.0.1: patches/linkify-it@4.0.1.patch
  # #1737; docs/contributing/dependency-patches.md
  markdown-it-myst@1.0.18: patches/markdown-it-myst@1.0.18.patch
  # #1893; docs/contributing/dependency-patches.md
  markdown-it-task-lists@2.1.1: patches/markdown-it-task-lists@2.1.1.patch
  # #11, #346, #1147; docs/contributing/dependency-patches.md
  markdown-it@13.0.2: patches/markdown-it@13.0.2.patch
  # #734, #730, #1737, #1893; docs/contributing/dependency-patches.md
  myst-parser@1.7.4: patches/myst-parser@1.7.4.patch
  # #730, #734, #2053; docs/contributing/dependency-patches.md
  myst-to-md@1.0.17: patches/myst-to-md@1.0.17.patch
  # #542, #144, #1827; docs/contributing/dependency-patches.md
  prosemirror-view@1.42.9: patches/prosemirror-view@1.42.9.patch
